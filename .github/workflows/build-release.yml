name: Build & Release

# 触发方式：打 tag (v*) 自动构建并发布 Release；或手动从 Actions 页触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows .exe ----------
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare game file
        run: copy crypt_of_eldermere.html game.html

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Build exe
        shell: cmd
        run: |
          pyinstaller --onefile --noconfirm --name CryptOfEldermere ^
            --add-data "game.html;." ^
            --collect-all pywebview ^
            --windowed packaging/exe/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/CryptOfEldermere.exe
          if-no-files-found: error

  # ---------- Android .apk ----------
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p packaging/apk/www
          cp crypt_of_eldermere.html packaging/apk/www/index.html

      - name: Install Capacitor deps
        working-directory: packaging/apk
        run: npm install

      - name: Add Android platform
        working-directory: packaging/apk
        run: npx cap add android

      - name: Sync web assets
        working-directory: packaging/apk
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build debug APK
        working-directory: packaging/apk/android
        run: ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packaging/apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------- 发布 Release（仅打 tag 时）----------
  release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/windows-exe/CryptOfEldermere.exe
            artifacts/android-apk/app-debug.apk
